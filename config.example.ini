; Copiar a config.ini (no se sube al repositorio).

[general]
; Máximo de caracteres por línea en la descripción de Aniwin (confirmado por el usuario B).
max_chars_linea = 90
log_dir = logs

[origen]
; Pendiente de decidir: carpeta | tasks | gmail | sheets | keep_workspace
tipo = carpeta
; Para tipo = carpeta (valor provisional para desarrollo):
carpeta_entrada = entrada
carpeta_procesadas = entrada\procesadas
carpeta_errores = entrada\errores

[salida]
; Pendiente de confirmar el formato de importación de Aniwin. De momento: texto listo para pegar.
tipo = texto
carpeta_salida = salida

[aniwin]
; Ruta confirmada por el usuario B (comprobar si hay un espacio antes de .MDB).
ruta_mdb = C:\AniwinNET\FERNANDO .MDB
; Serie de los albaranes (A6 en las capturas; sin confirmar que sea siempre A6).
serie = A6

[copias]
carpeta_copias = D:\copias_aniwin
; Propuesta inicial, por validar con el usuario B.
conservar_diarias = 30
conservar_mensuales = 12
